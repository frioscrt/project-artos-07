<style>

/* tương tác người đọc */

<style>

  var root=document.documentElement, tb=document.getElementById('theme');

        var old=i<st.length-1 && s.tier!=='?' && s.tier!==st[i+1].tier;
        if(s.quote) out+='<blockquote'+(old?' class="old"':'')+'>“'+esc(s.quote)+'”<span class="who">'+esc(s.who)+', chương '+s.ch+'</span></blockquote>';
        if(s.aside) out+='<p class="aside">'+esc(s.aside)+(s.quote?'':' <span class="who">Chương '+s.ch+'</span>')+'</p>';
      });
      if(x.gone) out+='<p class="gone-t">Mất ở chương '+p.dead+'.</p>';
      out+='</article>';
    });
    out+='</div>';
    if(n>=D.typesFrom){
      out+='<h2>Bảy hệ, theo lời Luke</h2><div class="types">'+D.types.map(function(t){return '<div class="ty">'+t.svg+'<div><b>'+esc(t.vi)+'</b><i>'+esc(t.en)+'</i><p>'+esc(t.line)+'</p></div></div>'}).join('')+'</div>';
    }
    document.getElementById('out').innerHTML=out;
  }
  render(seen);
})();
</script>
</body>
</html>
